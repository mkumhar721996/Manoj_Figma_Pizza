<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — Slice House</title>
<link rel="stylesheet" href="/design-system/tokens.css" />
<link rel="stylesheet" href="/design-system/prototype-utils.css" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body class="u-surface">

  <div class="brand-header">
    <div class="brand-mark">S</div>
    <div class="brand-name">Slice House</div>
  </div>

  <main class="stage">
    <div class="auth-card">
      <div class="card u-stack">
        <div>
          <h1 class="card-title" style="margin-bottom: 4px;">Reset your password</h1>
          <p class="u-text-sm u-text-muted">Enter your registered email or mobile number. We'll send you a reset link and a one-time code.</p>
        </div>
        <form class="u-stack" id="forgot-form">
          <div class="field">
            <label class="field-label" for="forgot-identifier">Email or mobile number</label>
            <input class="input" id="forgot-identifier" type="text" placeholder="you@example.com or +1 415 555 0100" />
          </div>
          <button type="submit" class="btn btn-primary">Send reset instructions</button>
          <a class="link-button" href="/login.html" style="align-self:flex-start; text-decoration: underline;">Back to log in</a>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/forgotPassword.js"></script>
</body>
</html>
